[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["bench", "tests"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0 OR MIT"
rust-version = "1.96"
authors = ["Agustin Garcia <81272885+agusgarcia3007@users.noreply.github.com>"]
repository = "https://github.com/olimpiacloud/acropolis"
homepage = "https://github.com/olimpiacloud/acropolis"
publish = false

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.dependencies]
acropolis-events = { path = "crates/acropolis-events" }
acropolis-store = { path = "crates/acropolis-store" }
acropolis-fetch = { path = "crates/acropolis-fetch" }
acropolis-oci = { path = "crates/acropolis-oci" }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util", "process", "signal"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "http2", "stream", "json"] }
# ring instead of reqwest's default aws-lc-rs: 2 MB smaller binary and no aws-lc C build. Installed by
# `acropolis_fetch::ensure_tls()`, which must run before any `reqwest::Client` is built.
rustls = { version = "0.23", default-features = false, features = ["ring"] }
futures = "0.3"
bytes = "1"
sha2 = "0.11"
sha1 = "0.11"
base64 = "0.22"
hex = "0.4"
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
zstd = { version = "0.13", features = ["zstdmt"] }
liblzma = "0.4"
clap = { version = "4", features = ["derive", "env"] }
semver = "1"
json5 = "0.4"
tempfile = "3"
rayon = "1"
libc = "0.2"
url = "2"

[profile.release]
lto = "thin"
# 1 instead of 16: binary 14 % smaller (29.2 -> 25.0 MB), cold release build 4m39s -> 7m19s on 5 vCPUs.
codegen-units = 1
strip = "symbols"
panic = "abort"

[profile.fast]
inherits = "release"
lto = false
codegen-units = 256
incremental = true
strip = "none"

[profile.dev.package."*"]
opt-level = 2
