[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["bench", "tests"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0 OR MIT"
rust-version = "1.90"

[workspace.dependencies]
acro-events = { path = "crates/acro-events" }
acro-store = { path = "crates/acro-store" }
acro-fetch = { path = "crates/acro-fetch" }
acro-oci = { path = "crates/acro-oci" }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util", "process", "signal"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2", "stream", "json"] }
futures = "0.3"
bytes = "1"
sha2 = "0.11"
sha1 = "0.11"
base64 = "0.22"
hex = "0.4"
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
zstd = { version = "0.13", features = ["zstdmt"] }
liblzma = { version = "0.4", features = ["parallel"] }
clap = { version = "4", features = ["derive", "env"] }
semver = "1"
json5 = "0.4"
tempfile = "3"
rayon = "1"
libc = "0.2"
url = "2"
memchr = "2"

[profile.release]
lto = "thin"
codegen-units = 16
debug = "line-tables-only"
panic = "abort"

[profile.dev.package."*"]
opt-level = 2
