name: App not detected
description: Acropolis doesn't recognize the language or framework, or picks the wrong version, start command or base image.
labels: [detection]
body:
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `acropolis --version`.
    validations:
      required: true
  - type: input
    id: repo
    attributes:
      label: Repo
      description: URL of a public repo that reproduces it. If it's private, describe the layout (files at the root, lockfile, `package.json` without dependencies, etc.).
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
      description: Language, framework, version, package manager, build and start commands. If Railpack or Nixpacks build it correctly, say so.
    validations:
      required: true
  - type: textarea
    id: plan
    attributes:
      label: Plan
      description: Output of `acropolis plan <dir> --json`.
      render: json
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Config
      description: Contents of `railpack.json` or `acropolis.json`, if any.
      render: json
