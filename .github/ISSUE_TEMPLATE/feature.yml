name: Propuesta
description: Un ecosistema, framework u opción nueva.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problema
      description: Qué no se puede hacer hoy y para qué apps. Si hay un repo de ejemplo, enlazalo.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Propuesta
      description: Cómo debería comportarse Acropolis. Si Railpack o Nixpacks ya lo resuelven, cómo lo hacen.
    validations:
      required: true
