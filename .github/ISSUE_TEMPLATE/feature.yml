name: Proposal
description: A new ecosystem, framework or option.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can't be done today and for which apps. If there is a sample repo, link it.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How Acropolis should behave. If Railpack or Nixpacks already solve it, how they do it.
    validations:
      required: true
