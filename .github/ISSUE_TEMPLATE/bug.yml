name: Bug
description: A build fails, the image doesn't run, or Acropolis does something other than expected.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        If the app is not detected or is detected wrongly, use the "App not detected" template.
        Don't paste secrets: check variables (`-e`) and private registry URLs before submitting.
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `acropolis --version`.
      placeholder: acropolis 0.1.0
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Host distro and glibc (`ldd --version`), architecture, whether it runs in a container and with which privileges.
      placeholder: Debian 12 x86_64, docker run --privileged
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened and what you expected
      description: Exact command, exit code, and the resulting image or error.
    validations:
      required: true
  - type: input
    id: repo
    attributes:
      label: Repo to reproduce
      description: URL of a minimal public repo, or the failing Railpack example.
  - type: textarea
    id: plan
    attributes:
      label: Plan
      description: Output of `acropolis plan <dir> --json`.
      render: json
  - type: textarea
    id: events
    attributes:
      label: Event log
      description: Stderr output with `--events json` (the last ~200 lines are enough).
      render: text
    validations:
      required: true
