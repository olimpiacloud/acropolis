name: PR title

# Squash merges use the PR title as the commit message, and release-plz builds
# the version bump and CHANGELOG.md from those commits (Conventional Commits).
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  conventional-commit:
    name: conventional-commit
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: read # read the PR title
    steps:
      - uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
