version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
    groups:
      cargo:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /deploy/builder
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
    groups:
      docker:
        patterns: ["*"]

  # Benchmark fixtures: no version updates (they would change what the benchmark measures), only security
  # updates, grouped and titled as Conventional Commits so the PR-title check passes.
  - package-ecosystem: npm
    directories: ["/bench/apps/*"]
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    commit-message:
      prefix: "chore(bench)"
    groups:
      bench-security:
        applies-to: security-updates
        patterns: ["*"]
