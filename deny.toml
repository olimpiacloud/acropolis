# cargo-deny: https://embarkstudios.github.io/cargo-deny/
# `cargo deny check` runs in CI (advisories, bans, licenses, sources).

[graph]
# Acropolis only builds for Linux (namespaces, overlayfs).
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]
all-features = true

[advisories]
# Unmaintained or unsound crates fail too, not only vulnerabilities.
unmaintained = "all"
yanked = "deny"
ignore = []

[licenses]
# Every license in the Linux dependency tree (`cargo deny list -l license`),
# all compatible with Apache-2.0 OR MIT distribution.
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "ISC",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Path dependencies inside the workspace are not wildcards.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
